[project]
name = "tash"
cmake_option_prefix = "TASH"
module_define_prefix = "TASH"

[venv]
# pybind11: the bindings, built from *.pybind.cpp and embedded.
extra_deps = ["pybind11==3.0.4"]

[test]
# neither is a module, so their suites are declared rather than found.
python = ["tools", "examples/columns", "examples/scooby"]

[coverage]
# The extension the bindings build, for the suite that imports it.
bridge_dirs = ["sources/tash/python"]

[conan]
# The recorder writes one MKV: H.264 through libx264 (which makes this ffmpeg
# build GPL), PCM audio, swscale for the pixel format; OpenCV is core,
# imgproc and imgcodecs with PNG. The rest is backends tash never loads.
options_linux = [
  "ffmpeg/*:avdevice=False", "ffmpeg/*:avfilter=False",
  "ffmpeg/*:swresample=False", "ffmpeg/*:with_programs=False",
  "ffmpeg/*:with_libx264=True",
  "ffmpeg/*:with_libalsa=False", "ffmpeg/*:with_pulse=False",
  "ffmpeg/*:with_xcb=False", "ffmpeg/*:with_xlib=False",
  "ffmpeg/*:with_vaapi=False", "ffmpeg/*:with_vdpau=False",
  "ffmpeg/*:with_ssl=False", "ffmpeg/*:with_freetype=False",
  "ffmpeg/*:with_bzip2=False", "ffmpeg/*:with_lzma=False",
  "ffmpeg/*:with_libiconv=False",
  "ffmpeg/*:with_libx265=False", "ffmpeg/*:with_libvpx=False",
  "ffmpeg/*:with_libaom=False", "ffmpeg/*:with_libsvtav1=False",
  "ffmpeg/*:with_libdav1d=False", "ffmpeg/*:with_openh264=False",
  "ffmpeg/*:with_openjpeg=False", "ffmpeg/*:with_libwebp=False",
  "ffmpeg/*:with_opus=False", "ffmpeg/*:with_vorbis=False",
  "ffmpeg/*:with_libmp3lame=False", "ffmpeg/*:with_libfdk_aac=False",

  "opencv/*:imgproc=True", "opencv/*:imgcodecs=True",
  "opencv/*:with_png=True",
  "opencv/*:calib3d=False", "opencv/*:dnn=False", "opencv/*:features2d=False",
  "opencv/*:flann=False", "opencv/*:gapi=False", "opencv/*:highgui=False",
  "opencv/*:ml=False", "opencv/*:objdetect=False", "opencv/*:photo=False",
  "opencv/*:stitching=False", "opencv/*:video=False", "opencv/*:videoio=False",
  "opencv/*:with_eigen=False", "opencv/*:with_jpeg=False",
  "opencv/*:with_jpeg2000=False", "opencv/*:with_openexr=False",
  "opencv/*:with_tiff=False", "opencv/*:with_webp=False",
  "opencv/*:with_imgcodec_hdr=False", "opencv/*:with_imgcodec_pfm=False",
  "opencv/*:with_imgcodec_pxm=False", "opencv/*:with_imgcodec_sunraster=False",
]

[cmake]
# oxbox::cli and oxbox::serialization read a type through the reflect tag.
extensions = ["reflect"]

[runtime]
# The cores are dlopened by name from beside the binary, so they install there.
from = ["libretro-cores"]

[run]
default = "tash"
