header:
  name: title-to-control
  profile: examples/scooby/profile.yaml
  core: genesis_plus_gx
  time_base: frame
  timeout_frames: 3000
  on_timeout: fail
segments:
  - name: power-on
    frames: 1

  # The title animates every frame (lightning over the graveyard), so the
  # anchor is the menu text alone, matched as an image.
  - name: title
    anchor:
      kind: template_image
      image: title-to-control.anchors/title.png
      minimum_score: 0.95
    frames: 1

  # Start on the title opens START / CONTINUE / CANCEL under the entry the
  # cursor is on, and that entry is PLAY BLAKE'S HOTEL until the player
  # moves it: the first scenario is the game's own offer and the order is
  # the player's. Start again takes START, and every Start after it skips
  # one beat of the arrival cutscene -- 380 frames against the 13,560 the
  # same cutscene takes with the pad untouched.
  - name: start-blakes-hotel
    frames: 380
    transitions: |
      0    down p1.start
      2    up   p1.start
      4    down p1.start
      6    up   p1.start
      8    down p1.start
      10   up   p1.start
