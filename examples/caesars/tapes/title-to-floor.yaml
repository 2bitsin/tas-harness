  # On the floor the player has a position; in the cashier he has none.
  # The floor takes a step 20 frames after it appears, measured; the tape
  # idles past that so the state it ends in can be walked out of.
  - name: floor
    anchor:
      kind: watch
      watch: player_x
      comparison: greater
      value: 0
    timeout_frames: 300
    frames: 32
