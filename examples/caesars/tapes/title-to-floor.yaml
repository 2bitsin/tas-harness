# Power on to the casino floor. The cashier will not deal with a walk-in:
# the account is made first, so the player reaches the floor with $2000 and
# the wallet the games read.
header:
  name: title-to-floor
  profile: examples/caesars/profile.yaml
  core: genesis_plus_gx
  time_base: frame
  timeout_frames: 600
  on_timeout: fail
segments:
  # The attract billboard pans and redraws, so nothing on it holds still
  # long enough to anchor on; from power on the frame count does.
  - name: attract
    anchor:
      kind: none
    frames: 1420
    transitions: |
      1400  down p1.start
      1408  up   p1.start

  # The palace front is a still picture, so the perceptual hash is exact.
  - name: palace-front
    anchor:
      kind: perceptual_hash
      hash: 50402f2f1cbf9e58
      max_distance: 2
    timeout_frames: 300
    frames: 90
    transitions: |
      77    down p1.start
      85    up   p1.start

  # QUICKASHIER: the third red button is NEW ACCOUNT, the name is typed on
  # the keyboard below, and OK is followed by the two password screens.
  - name: cashier
    anchor:
      kind: perceptual_hash
      hash: 4437cbc837c0acbc
      max_distance: 2
    timeout_frames: 300
    frames: 791
    transitions: |
      0     down p1.right
      3     up   p1.right
      73    down p1.right
      76    up   p1.right
      146   down p1.right
      149   up   p1.right
      219   down p1.right
